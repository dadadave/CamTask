name: mon_comptable
description: Mon Comptable / CAM-TAXE — déclarations et conseils fiscaux au Cameroun.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Téléversement des pièces (CNI, bulletins, factures…)
  file_picker: ^8.1.2
  # Persistance locale des demandes et de la messagerie
  shared_preferences: ^2.3.2
  # Authentification, base de donnees et stockage (voir supabase/schema.sql)
  supabase_flutter: ^2.17.2
  # Ouvrir un document depuis son lien signe
  url_launcher: ^6.3.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
